name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compact depth AI model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          python -m pip install --disable-pip-version-check --no-input --quiet --upgrade huggingface_hub
          hf download Devil-Assassin/wandering-mode midas_v21_small_256.tflite             --repo-type model             --local-dir app/src/main/assets
          MODEL="app/src/main/assets/midas_v21_small_256.tflite"
          test -s "$MODEL"
          SIZE=$(stat -c%s "$MODEL")
          echo "Depth model bytes: $SIZE"
          test "$SIZE" -eq 66306460
          SHA=$(sha256sum "$MODEL" | cut -d' ' -f1)
          echo "Depth model SHA256: $SHA"
          test "$SHA" = "70404b5c7b203aad381f588df05099e0b8dc4bc472d51c9c9eff729ccb64d073"
          ls -lh "$MODEL"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-FUSION-3D-Scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
