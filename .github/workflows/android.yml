name: Android APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compact depth AI model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          MODEL="app/src/main/assets/midas_small_256_fp16.tflite"
          URL="https://huggingface.co/litert-community/MiDaS-small/resolve/main/midas_small_256_fp16.tflite?download=true"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            -o "$MODEL" "$URL"
          test -s "$MODEL"
          SIZE=$(stat -c%s "$MODEL")
          echo "Depth model bytes: $SIZE"
          test "$SIZE" -eq 33507904
          SHA=$(sha256sum "$MODEL" | cut -d' ' -f1)
          echo "Depth model SHA256: $SHA"
          test "$SHA" = "bec9bce704789e504ec306196fcb0aabe90fd25c2b9d7db382339741950890ca"
          ls -lh "$MODEL"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-FUSION-3D-Scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
