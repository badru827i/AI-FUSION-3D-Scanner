name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download compact depth AI model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-lfs
          git lfs install
          git clone --depth 1 https://huggingface.co/Devil-Assassin/wandering-mode /tmp/depth-model
          test -s /tmp/depth-model/midas_v21_small_256.tflite
          mkdir -p app/src/main/assets
          cp /tmp/depth-model/midas_v21_small_256.tflite app/src/main/assets/midas_v21_small_256.tflite
          ls -lh app/src/main/assets/midas_v21_small_256.tflite
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-FUSION-3D-Scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# v0.7 compact local depth AI build
