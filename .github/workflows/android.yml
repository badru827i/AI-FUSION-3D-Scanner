name: Android APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pretrained Depth Anything V2 Small (LiteRT INT8 weights)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          MODEL="app/src/main/assets/depth_anything_v2_small_wi8_afp32.tflite"
          URL="https://huggingface.co/litert-community/depth-anything-v2-small/resolve/main/tflite/depth_anything_v2_small_wi8_afp32.tflite?download=true"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 600 \
            -o "$MODEL" "$URL"
          test -s "$MODEL"
          SIZE=$(stat -c%s "$MODEL")
          echo "Depth Anything V2 Small model bytes: $SIZE"
          test "$SIZE" -ge 25000000
          test "$SIZE" -le 30000000
          sha256sum "$MODEL"
          ls -lh "$MODEL"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-FUSION-3D-Scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
