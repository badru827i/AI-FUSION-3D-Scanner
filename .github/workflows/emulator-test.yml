name: AI-FUSION Emulator Test Bot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-fusion-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-ui-tests:
    name: Emulator UI and export-pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download and verify compact depth AI model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          MODEL="app/src/main/assets/midas_small_256_fp16.tflite"
          URL="https://huggingface.co/litert-community/MiDaS-small/resolve/main/midas_small_256_fp16.tflite?download=true"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 -o "$MODEL" "$URL"
          test -s "$MODEL"
          SIZE=$(stat -c%s "$MODEL")
          test "$SIZE" -eq 33507904
          SHA=$(sha256sum "$MODEL" | cut -d' ' -f1)
          test "$SHA" = "bec9bce704789e504ec306196fcb0aabe90fd25c2b9d7db382339741950890ca"
          echo "Verified depth model ($SIZE bytes, SHA256 $SHA)"

      - name: Run instrumented tests on Android emulator
        id: emulator-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back emulated
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace > emulator-test.log 2>&1
            TEST_EXIT=$?
            cat emulator-test.log
            adb logcat -d -v threadtime > emulator-logcat.txt 2>&1
            grep -E -i 'FATAL EXCEPTION|AndroidRuntime|Fatal signal|am_crash|Process.*(died|crash)|instrumentation' emulator-logcat.txt | tail -n 250 > emulator-crash-clues.txt || true
            printf 'connectedDebugAndroidTest exit code: %s\n' "$TEST_EXIT" > emulator-test-summary.txt
            echo "## Emulator instrumentation tests" >> "$GITHUB_STEP_SUMMARY"
            echo "- Command: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace" >> "$GITHUB_STEP_SUMMARY"
            echo "- Exit code: $TEST_EXIT" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit "$TEST_EXIT"

      - name: Write diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "# AI-FUSION Emulator Test Report"
            echo
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Commit: $GITHUB_SHA"
            echo "- Job status: ${{ job.status }}"
            echo "- Emulator API: 35 (Google APIs, x86_64)"
            echo
            echo "## Result"
            if [ -f emulator-test-summary.txt ]; then
              cat emulator-test-summary.txt
            else
              echo "The emulator test command did not produce its summary file; inspect the workflow step output."
            fi
            echo
            echo "## Crash clues"
            if [ -f emulator-crash-clues.txt ]; then
              cat emulator-crash-clues.txt
            else
              echo "No emulator crash clues were captured."
            fi
          } | tee emulator-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-FUSION-emulator-test-diagnostics
          path: |
            emulator-test-report.md
            emulator-test-summary.txt
            emulator-test.log
            emulator-logcat.txt
            emulator-crash-clues.txt
            app/build/reports/androidTests/**
            app/build/reports/tests/**
            app/build/outputs/androidTest-results/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
